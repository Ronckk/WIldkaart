<style>  :root{
    color-scheme: light;
    --bg:#f5f5f3;
    --surface:#ffffff;
    --map-surface:#f7f7f5;
    --ink:#131313;
    --ink-2:#454545;
    --muted:#87887f;
    --border:rgba(17,17,17,.13);
    --border-strong:rgba(17,17,17,.24);
    --accent:#141414;
    --accent-ink:#f5f5f3;
    --grid:#e4e4e1;
    --land:#ececea;
    --tab-bg:#e7e7e4;
    --s-zicht:#2a78d6;
    --s-aanval:#eb6834;
    --s-overig:#1baf7a;
    --pal-1:#2a78d6;
    --pal-2:#eb6834;
    --pal-3:#1baf7a;
    --pal-4:#eda100;
    --pal-5:#e87ba4;
    --pal-6:#008300;
    --pal-7:#4a3aa7;
    --shadow: 0 1px 2px rgba(21,32,24,.06), 0 8px 24px -12px rgba(21,32,24,.18);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      color-scheme: dark;
      --bg:#121212;
      --surface:#1c1c1c;
      --map-surface:#161616;
      --ink:#f2f2f0;
      --ink-2:#bdbdbd;
      --muted:#8a8a86;
      --border:rgba(255,255,255,.13);
      --border-strong:rgba(255,255,255,.24);
      --accent:#e8e8e8;
      --accent-ink:#121212;
      --grid:#2a2a2a;
      --land:#242424;
      --tab-bg:#232323;
      --s-zicht:#3987e5;
      --s-aanval:#d95926;
      --s-overig:#199e70;
      --pal-1:#3987e5;
      --pal-2:#d95926;
      --pal-3:#199e70;
      --pal-4:#c98500;
      --pal-5:#d55181;
      --pal-6:#008300;
      --pal-7:#9085e9;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 28px -12px rgba(0,0,0,.55);
    }
  }
  :root[data-theme="dark"]{
    color-scheme: dark;
    --bg:#121212;
    --surface:#1c1c1c;
    --map-surface:#161616;
    --ink:#f2f2f0;
    --ink-2:#bdbdbd;
    --muted:#8a8a86;
    --border:rgba(255,255,255,.13);
    --border-strong:rgba(255,255,255,.24);
    --accent:#e8e8e8;
    --accent-ink:#121212;
    --grid:#2a2a2a;
    --land:#242424;
    --tab-bg:#232323;
    --s-zicht:#3987e5;
    --s-aanval:#d95926;
    --s-overig:#199e70;
    --pal-1:#3987e5;
    --pal-2:#d95926;
    --pal-3:#199e70;
    --pal-4:#c98500;
    --pal-5:#d55181;
    --pal-6:#008300;
    --pal-7:#9085e9;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 28px -12px rgba(0,0,0,.55);
  }

  *{box-sizing:border-box;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  .page{
    max-width:980px;
    margin:0 auto;
    padding-inline:20px;
    padding-block: 28px 40px;
    display:flex;
    flex-direction:column;
    gap:22px;
  }
  .navbar{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:-6px;
  }
  .nav-links{
    flex:1;
    display:flex;
    justify-content:center;
    gap:4px;
    flex-wrap:wrap;
  }
  .nav-link{
    appearance:none;
    border:none;
    background:transparent;
    font:inherit;
    font-family:"IBM Plex Sans", sans-serif;
    font-weight:600;
    font-size:13.5px;
    color:var(--ink-2);
    padding:8px 14px;
    border-radius:9px;
    cursor:pointer;
    display:flex;
    align-items:center;
    gap:6px;
    white-space:nowrap;
    text-decoration:none;
  }
  .nav-link.active{ background:var(--tab-bg); color:var(--ink); }
  .nav-link:not(.is-soon):not(.active):hover{ background:var(--tab-bg); }
  .nav-link.is-soon{ color:var(--muted); cursor:default; opacity:.75; }
  .nav-link .soon-tag{
    font-family:"IBM Plex Mono", monospace;
    font-size:9px;
    font-weight:600;
    text-transform:uppercase;
    letter-spacing:.04em;
    background:var(--grid);
    color:var(--muted);
    padding:2px 6px;
    border-radius:99px;
  }
  .theme-toggle{
    appearance:none;
    border:1px solid var(--border);
    background:var(--surface);
    color:var(--ink);
    width:36px;
    height:36px;
    border-radius:10px;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:16px;
    flex:none;
  }
  .theme-toggle:hover{ background:var(--tab-bg); }
  .theme-toggle:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
  .theme-toggle .icon-moon{ display:none; }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]) .theme-toggle .icon-moon{ display:inline; }
    :root:not([data-theme="light"]) .theme-toggle .icon-sun{ display:none; }
  }
  :root[data-theme="dark"] .theme-toggle .icon-moon{ display:inline; }
  :root[data-theme="dark"] .theme-toggle .icon-sun{ display:none; }
  @media (max-width:520px){
    .nav-link{ padding:7px 9px; font-size:12.5px; }
    .nav-link .soon-tag{ display:none; }
    .nav-links{
      flex-wrap:nowrap;
      justify-content:flex-start;
      overflow-x:auto;
      -webkit-overflow-scrolling:touch;
      scrollbar-width:none;
      min-width:0;
    }
    .nav-links::-webkit-scrollbar{ display:none; }
  }

  .hero{ display:flex; flex-direction:column; gap:8px; }
  .eyebrow{
    font-family:"IBM Plex Mono", monospace;
    font-size:12px;
    letter-spacing:.09em;
    text-transform:uppercase;
    color:var(--accent);
    margin:0;
  }
  h1{
    font-family:"Fraunces", Georgia, serif;
    font-weight:600;
    font-size:clamp(28px, 5vw, 42px);
    line-height:1.08;
    margin:0;
    text-wrap:balance;
    letter-spacing:-.01em;
  }
  .sub{
    margin:0;
    max-width:62ch;
    color:var(--ink-2);
    font-size:15px;
    line-height:1.55;
  }
  .sub b{ color:var(--ink); font-weight:600; }

  .tabs{
    display:flex;
    flex-wrap:wrap;
    gap:4px;
    background:var(--tab-bg);
    border:1px solid var(--border);
    border-radius:12px;
    padding:4px;
    width:fit-content;
    max-width:100%;
  }
  .tab{
    appearance:none;
    border:none;
    background:transparent;
    color:var(--ink-2);
    font:inherit;
    font-family:"IBM Plex Sans", sans-serif;
    font-weight:600;
    font-size:13.5px;
    padding:9px 16px;
    border-radius:9px;
    cursor:pointer;
    white-space:nowrap;
  }
  .tab.active{
    background:var(--surface);
    color:var(--ink);
    box-shadow:var(--shadow);
  }
  .tab:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }

  .stats{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:1px;
    background:var(--border);
    border:1px solid var(--border);
    border-radius:14px;
    overflow:hidden;
  }
  .stat{
    background:var(--surface);
    padding:14px 16px;
    display:flex;
    flex-direction:column;
    gap:4px;
    min-width:0;
  }
  .stat .n{
    font-family:"IBM Plex Mono", monospace;
    font-size:22px;
    font-weight:500;
    font-variant-numeric:tabular-nums;
    color:var(--ink);
  }
  .stat .l{
    font-size:11.5px;
    color:var(--muted);
    text-transform:uppercase;
    letter-spacing:.06em;
  }
  .stat.k-aanval .n{ color:var(--s-aanval); }
  .stat.k-zicht .n{ color:var(--s-zicht); }

  .map-card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:16px;
    box-shadow:var(--shadow);
    padding:14px 14px 8px;
  }
  .map-search{ position:relative; margin-bottom:10px; }
  .search-input{
    width:100%;
    font:inherit;
    font-family:"IBM Plex Sans", sans-serif;
    font-size:16px;
    padding:12px 14px;
    border-radius:10px;
    border:1px solid var(--border);
    background:var(--map-surface);
    color:var(--ink);
  }
  .search-input:focus{ outline:2px solid var(--accent); outline-offset:1px; }
  .search-input::placeholder{ color:var(--muted); }
  .search-results{
    position:absolute;
    top:calc(100% + 4px);
    left:0; right:0;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:10px;
    box-shadow:var(--shadow);
    max-height:280px;
    overflow-y:auto;
    z-index:6;
  }
  .search-item{
    display:flex;
    flex-direction:column;
    gap:2px;
    padding:9px 14px;
    cursor:pointer;
    border-bottom:1px solid var(--border);
  }
  .search-item:last-child{ border-bottom:none; }
  .search-item:hover, .search-item.active{ background:var(--tab-bg); }
  .search-item .si-name{ font-size:13.5px; font-weight:600; color:var(--ink); }
  .search-item .si-meta{ font-size:11.5px; color:var(--muted); }
  .search-item .si-meta.has-attack{ color:var(--s-aanval); }
  .search-empty{ padding:11px 14px; font-size:12.5px; color:var(--muted); }
  .map-wrap{
    position:relative;
    border-radius:10px;
    overflow:hidden;
    background:var(--map-surface);
    border:1px solid var(--border);
  }
  .zoom-controls{
    position:absolute;
    right:10px;
    bottom:10px;
    z-index:6;
    display:flex;
    flex-direction:column;
    gap:1px;
    background:var(--border);
    border:1px solid var(--border);
    border-radius:9px;
    overflow:hidden;
    box-shadow:var(--shadow);
  }
  .zoom-controls button{
    appearance:none;
    border:none;
    background:var(--surface);
    color:var(--ink);
    width:30px;
    height:30px;
    font-size:16px;
    line-height:1;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:"IBM Plex Sans", sans-serif;
  }
  .zoom-controls button:hover{ background:var(--tab-bg); }
  .zoom-controls button:focus-visible{ outline:2px solid var(--accent); outline-offset:-2px; }

  .map-wrap{ height:520px; }
  @media (max-width:640px){ .map-wrap{ height:400px; } }
  #map{ width:100%; height:100%; background:var(--map-surface); }
  .leaflet-container{ position:relative; z-index:0; font-family:"IBM Plex Sans", sans-serif; background:var(--map-surface); }
  .leaflet-control-attribution{ font-size:10px; background:rgba(255,255,255,.75); }
  .leaflet-control-zoom{ display:none; }
  .leaflet-popup-content-wrapper{
    background:var(--ink);
    color:var(--bg);
    border-radius:10px;
    box-shadow:0 10px 30px -8px rgba(0,0,0,.45);
  }
  .leaflet-popup-content{ margin:10px 12px; font-size:12.5px; line-height:1.45; }
  .leaflet-popup-tip{ background:var(--ink); }
  .leaflet-popup-close-button{ color:var(--bg) !important; opacity:.7; }
  .leaflet-popup-close-button:hover{ opacity:1; }
  .pulse-halo{
    animation: pulse-breathe 1.8s ease-out infinite;
    transform-box: fill-box;
    transform-origin: center;
    pointer-events: none;
  }
  @keyframes pulse-breathe{
    0%   { transform: scale(1);   opacity: .65; }
    70%  { transform: scale(2.2); opacity: 0; }
    100% { transform: scale(2.2); opacity: 0; }
  }
  .tt-name{ font-family:"IBM Plex Sans", sans-serif; font-weight:700; font-size:13.5px; margin-bottom:3px; }
  .exact-badge{ color:var(--muted); font-weight:700; margin-left:4px; font-size:.85em; }
  .tt-row{ display:flex; justify-content:space-between; gap:10px; font-family:"IBM Plex Mono", monospace; font-size:11px; opacity:.92; }
  .tt-dates{ margin-top:6px; padding-top:6px; border-top:1px solid rgba(255,255,255,.18); font-family:"IBM Plex Mono", monospace; font-size:10.5px; opacity:.85; }
  .tt-dates div.date-row{ white-space:nowrap; }

  .map-foot{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:12px;
    flex-wrap:wrap;
    padding:10px 4px 6px;
  }

  .legend{
    display:flex;
    flex-wrap:wrap;
    gap:16px;
    align-items:center;
    font-size:12.5px;
    color:var(--ink-2);
  }
  .legend-group{ display:flex; align-items:center; gap:8px; }
  .swatch{ width:10px; height:10px; border-radius:50%; display:inline-block; flex:none; }

  .animal-card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:16px;
    box-shadow:var(--shadow);
    padding:20px 22px;
    display:flex;
    flex-direction:column;
    gap:14px;
  }
  .card-title{
    font-family:"Fraunces", Georgia, serif;
    font-weight:600;
    font-size:19px;
    margin:0;
    letter-spacing:-.005em;
  }
  .bar-chart{
    display:flex;
    flex-direction:column;
    gap:9px;
    margin-top:2px;
  }
  .bar-row{
    display:flex;
    flex-direction:column;
    gap:2px;
    padding:4px 6px;
    margin:0 -6px;
    border-radius:8px;
    transition: background .12s ease;
  }
  .bar-row:hover{ background:var(--tab-bg); }
  .bar-top{
    display:grid;
    grid-template-columns:118px 1fr 34px;
    align-items:center;
    gap:10px;
  }
  .bar-label{
    font-size:13px;
    color:var(--ink);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    transition: color .12s ease;
  }
  .bar-row.is-unknown .bar-label{ color:var(--muted); }
  .bar-track{
    position:relative;
    height:15px;
    background:var(--grid);
    border-radius:4px;
    overflow:hidden;
    transition: box-shadow .12s ease;
  }
  .bar-row:hover .bar-track{ box-shadow:inset 0 0 0 1px var(--border-strong); }
  .bar-fill{
    position:absolute;
    inset:0 auto 0 0;
    min-width:5px;
    border-radius:4px;
    background:var(--bar-color, var(--muted));
    transition: filter .12s ease;
  }
  .bar-row:hover .bar-fill{ filter:brightness(1.15) saturate(1.1); }
  .bar-row.is-unknown .bar-fill{ background:var(--muted); opacity:.5; }
  .bar-row.is-unknown:hover .bar-fill{ filter:none; opacity:.7; }
  .bar-row:hover .bar-value{ color:var(--ink); font-weight:600; }
  .bar-value{
    font-family:"IBM Plex Mono", monospace;
    font-size:12.5px;
    transition: color .12s ease, font-weight .12s ease;
    font-variant-numeric:tabular-nums;
    color:var(--ink);
    text-align:right;
  }
  .card-foot{
    font-size:11.5px;
    color:var(--muted);
    line-height:1.6;
    border-top:1px solid var(--border);
    padding-top:12px;
    margin-top:2px;
  }
  .notice{
    font-size:12.5px;
    color:var(--ink-2);
    line-height:1.55;
    background:var(--map-surface);
    border:1px solid var(--border);
    border-radius:10px;
    padding:10px 12px;
  }
  .sub-h{
    font-family:"IBM Plex Sans", sans-serif;
    font-weight:600;
    font-size:13.5px;
    color:var(--ink);
    margin:2px 0 0;
  }
  .week-strip{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(92px, 1fr));
    gap:8px;
  }
  .week-card{
    background:var(--map-surface);
    border:1px solid var(--border);
    border-radius:10px;
    padding:10px 6px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:6px;
    text-align:center;
  }
  .week-range{
    font-family:"IBM Plex Mono", monospace;
    font-size:10.5px;
    color:var(--ink-2);
    line-height:1.3;
  }
  .week-badge{ display:flex; align-items:center; gap:5px; font-size:10px; font-weight:600; color:var(--muted); }
  .week-badge .dot{ width:8px; height:8px; border-radius:50%; flex:none; }
  .lvl-rustig .dot{ background:var(--muted); }
  .lvl-gemiddeld .dot{ background:var(--pal-4); }
  .lvl-verhoogd .dot{ background:var(--s-aanval); }
  .lvl-verhoogd.week-badge{ color:var(--s-aanval); }
  .lvl-gemiddeld.week-badge{ color:var(--ink-2); }
  .level-legend{ display:flex; flex-wrap:wrap; gap:14px; font-size:11.5px; color:var(--muted); }
  .level-legend .week-badge{ font-size:11.5px; }
  .hotspot-list{ display:flex; flex-wrap:wrap; gap:8px; }
  .hotspot-chip{
    display:flex;
    align-items:center;
    gap:7px;
    background:var(--map-surface);
    border:1px solid var(--border);
    border-radius:99px;
    padding:6px 13px 6px 10px;
    font-size:12.5px;
    color:var(--ink);
  }
  .hotspot-chip .hc-n{
    font-family:"IBM Plex Mono", monospace;
    font-size:11px;
    font-weight:600;
    color:var(--s-aanval);
    background:var(--surface);
    border-radius:99px;
    padding:1px 7px;
  }
  .fun-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:1px;
    background:var(--border);
    border:1px solid var(--border);
    border-radius:14px;
    overflow:hidden;
  }
  .fun-tile{ background:var(--surface); padding:14px 16px; display:flex; flex-direction:column; gap:4px; }
  .fun-tile .n{
    font-family:"IBM Plex Mono", monospace;
    font-size:16px;
    font-weight:600;
    color:var(--ink);
  }
  .fun-tile .l{ font-size:11.5px; color:var(--muted); line-height:1.45; }
  @media (min-width:641px){
    .fun-grid{ grid-template-columns:repeat(4,1fr); }
  }
  @media (max-width:640px){
    .bar-top{ grid-template-columns:92px 1fr 30px; gap:7px; }
    .bar-label{ font-size:11.5px; }
    .zoom-controls button{ width:38px; height:38px; font-size:18px; }
    .search-item{ padding:11px 14px; }
    .week-strip{ grid-template-columns:repeat(3, 1fr); }
  }
  @media (max-width:360px){
    .week-strip{ grid-template-columns:repeat(2, 1fr); }
  }

  footer{
    display:flex;
    flex-direction:column;
    gap:6px;
    font-size:12px;
    color:var(--muted);
    line-height:1.6;
    border-top:1px solid var(--border);
    padding-top:16px;
  }
  footer a{ color:var(--ink-2); }

  @media (max-width:640px){
    .stats{ grid-template-columns:repeat(2,1fr); }
    h1{ font-size:26px; }
  }

  #backToTop{
    position:fixed;
    right:20px;
    bottom:20px;
    z-index:50;
    width:44px;
    height:44px;
    border-radius:50%;
    border:1px solid var(--border);
    background:var(--pal-7);
    color:#fff;
    font-size:18px;
    line-height:1;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow:var(--shadow);
    opacity:0;
    transform:translateY(8px);
    pointer-events:none;
    transition:opacity .18s ease, transform .18s ease;
  }
  #backToTop.is-visible{ opacity:1; transform:translateY(0); pointer-events:auto; }
  #backToTop:hover{ filter:brightness(1.08); }
  #backToTop:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
</style>
</head>
<body>
<div class="page">
  <nav class="navbar">
    <div class="nav-links">
      <a href="./" class="nav-link">Home</a>
      <button type="button" class="nav-link active" aria-current="page">Wolven</button>
      <a href="zwijnen" class="nav-link">Zwijnen</a>
      <button type="button" class="nav-link is-soon" disabled title="Binnenkort beschikbaar &mdash; we verzamelen nog data">Herten <span class="soon-tag">binnenkort</span></button>
      <button type="button" class="nav-link is-soon" disabled title="Binnenkort beschikbaar &mdash; we verzamelen nog data">Overig <span class="soon-tag">binnenkort</span></button>
    </div>
    <button type="button" class="theme-toggle" id="themeToggle" aria-label="Wissel tussen licht en donker">
      <span class="icon-sun">&#9728;&#65039;</span><span class="icon-moon">&#127769;</span>
    </button>
  </nav>
  <header class="hero">
    <h1>Wolvenmeldingen op de Veluwe</h1>
  </header>

  <div class="tabs" role="tablist">
    <button class="tab active" data-set="all" role="tab" aria-selected="true">Sinds nov 2025</button>
    <button class="tab" data-set="last2w" role="tab" aria-selected="false">Laatste 2 weken (3&ndash;17 sep)</button>
  </div>

  <section class="stats" id="stats"></section>

  <section class="map-card">
    <div class="map-search">
      <input type="text" id="placeSearch" class="search-input" placeholder="Zoek een plaats&hellip; (bv. Putten, Epe)" autocomplete="off" aria-label="Zoek een plaats op de kaart">
      <div class="search-results" id="searchResults" hidden></div>
    </div>
    <div id="explorer"></div>
    <div class="map-wrap">
      <div id="map" role="img" aria-label="Kaart met wolvenmeldingen op de Veluwe"></div>
      <div class="zoom-controls">
        <button type="button" id="zoomIn" aria-label="Inzoomen">+</button>
        <button type="button" id="zoomOut" aria-label="Uitzoomen">&minus;</button>
        <button type="button" id="zoomReset" aria-label="Kaart resetten" style="font-size:12px;">&#8634;</button>
      </div>
    </div>
    <div class="map-foot">
      <div class="legend">
        <div class="legend-group"><span class="swatch" style="background:var(--s-zicht)"></span>Zichtmelding</div>
        <div class="legend-group"><span class="swatch" style="background:var(--s-aanval)"></span>Aanval op vee</div>
        <div class="legend-group"><span class="swatch" style="background:var(--s-overig)"></span>Overig (schurft / aanrijding)</div>
      </div>
    </div>
  </section>

  <section class="animal-card" id="attackAnimalsCard"></section>

  <section class="animal-card" id="killedCard"></section>

  <section class="animal-card" id="forecastCard"></section>

  <section class="animal-card" id="funCard"></section>

  <footer>
    <div id="outlierNote"></div>
    <div>Kloppen een naam of aantal niet? Dan zit er vermoedelijk een tikfout of dubbele melding in de brontekst.</div>
    <div>© 2026 Wilde Dieren in Kaart &middot; Gebouwd door <a href="https://rlode.nl/" target="_blank" rel="noopener noreferrer">rlode.nl</a></div>
  </footer>
</div>

<button id="backToTop" type="button" aria-label="Naar boven">&uarr;</button>

<script src="data/wolven-data.js?v=be131dbd69"></script>
<script src="assets/site.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<script src="assets/map-tools.js"></script>
<script>
(function(){
  // ---- theme toggle (light/dark), persisted per-viewer ----
  var THEME_KEY = 'wolvenkaart-theme';
  var themeToggle = document.getElementById('themeToggle');
  function currentTheme(){
    var explicit = document.documentElement.getAttribute('data-theme');
    if (explicit === 'dark' || explicit === 'light') return explicit;
    return (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
  }
  function applyTheme(t){
    document.documentElement.setAttribute('data-theme', t);
    try { localStorage.setItem(THEME_KEY, t); } catch(e){}
    themeToggle.setAttribute('aria-label', t === 'dark' ? 'Zet lichte modus aan' : 'Zet donkere modus aan');
  }
  if (themeToggle){
    // don't force an explicit attribute on load (that would stop the page from
    // following live OS theme changes) — only set one once the viewer actually toggles
    themeToggle.setAttribute('aria-label', currentTheme() === 'dark' ? 'Zet lichte modus aan' : 'Zet donkere modus aan');
    themeToggle.addEventListener('click', function(){
      applyTheme(currentTheme() === 'dark' ? 'light' : 'dark');
    });
  }
  var wolvenNavLink = document.querySelector('.nav-link.active');
  if (wolvenNavLink){
    wolvenNavLink.addEventListener('click', function(){
      window.scrollTo({ top:0, behavior:'smooth' });
    });
  }

  // De plaatsen worden in assets/site.js uit de gebeurtenissen (`ev`) berekend. Type, periode, tijdschuif en
  // hitte-laag komen uit de filterbalk (assets/map-tools.js); de tabbladen zijn snelkeuzes voor de periode.
  var RECENT_DAYS = 14;
  var LOADED = WDK.load('wolf');
  var DATA = { all: LOADED.veluwe };
  var placeById = {}; // id -> plaats (meerdere plaatsen kunnen dezelfde naam hebben, de id is uniek)
  DATA.all.forEach(function(b){ placeById[b.id] = b; });
  document.querySelector('.tab[data-set="all"]').textContent = 'Sinds ' + WDK.monthYear(WDK.stats(DATA.all).dateMin);
  document.querySelector('.tab[data-set="last2w"]').textContent = 'Laatste 2 weken (' + WDK.recentLabel(RECENT_DAYS) + ')';

  var COLORS = {
    zichtmelding: 'var(--s-zicht)',
    aanval: 'var(--s-aanval)',
    overig: 'var(--s-overig)'
  };
  var TYPE_LABEL = WDK.TYPE_LABEL, fmtDate = WDK.fmtDate;
  var stripExact = WDK.stripExact, nameHtml = WDK.nameHtml;

  // ---- echte kaart (Leaflet + OpenStreetMap) ----
  var INITIAL_CENTER = [52.24, 5.85], INITIAL_ZOOM = 10;
  var map = L.map('map', { zoomControl:false, scrollWheelZoom:true }).setView(INITIAL_CENTER, INITIAL_ZOOM);
  var LIGHT_TILES = 'https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png?key=cb1_3pk1_1_4be88f8eb009c48504d37519';
  var DARK_TILES = 'https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png?key=cb1_3pk1_1_4be88f8eb009c48504d37519';
  var TILE_ATTR = '&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener noreferrer">OpenStreetMap</a>-bijdragers &copy; <a href="https://carto.com/attributions" target="_blank" rel="noopener noreferrer">CARTO</a>';
  function currentMapTheme(){
    var explicit = document.documentElement.getAttribute('data-theme');
    if (explicit === 'dark' || explicit === 'light') return explicit;
    return (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
  }
  var tileLayer = L.tileLayer(currentMapTheme() === 'dark' ? DARK_TILES : LIGHT_TILES, {
    maxZoom: 20,
    subdomains: 'abcd',
    attribution: TILE_ATTR
  }).addTo(map);
  function syncTiles(){ tileLayer.setUrl(currentMapTheme() === 'dark' ? DARK_TILES : LIGHT_TILES); }
  var themeToggleBtn = document.getElementById('themeToggle');
  if (themeToggleBtn) themeToggleBtn.addEventListener('click', function(){ setTimeout(syncTiles, 0); });
  if (window.matchMedia) window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', syncTiles);

  var markersLayer = L.layerGroup().addTo(map);
  var markerIndex = {}; // plaatsnaam -> { marker, b }
  var mapWrap = document.querySelector('.map-wrap');

  function radius(count, maxC){
    var R0 = 6, R1 = 26;
    return R0 + (R1-R0) * Math.sqrt(count/maxC);
  }

  function popupHtml(b){
    var html = '<div class="tt-name">'+nameHtml(b.n)+'</div>';
    if (b.c.zichtmelding) html += '<div class="tt-row"><span>Zichtmeldingen</span><span>'+b.c.zichtmelding+'</span></div>';
    if (b.c.aanval) html += '<div class="tt-row"><span>Aanvallen op vee</span><span>'+b.c.aanval+'</span></div>';
    if (b.c.overig) html += '<div class="tt-row"><span>Overig</span><span>'+b.c.overig+'</span></div>';
    var recent = b.ev.slice(0,5);
    html += '<div class="tt-dates">' + recent.map(function(e){
      return '<div class="date-row">'+fmtDate(e.d)+(e.tm ? ', '+e.tm : '')+' &middot; '+TYPE_LABEL[e.ty]+'</div>';
    }).join('') + (b.ev.length>5 ? '<div>+ '+(b.ev.length-5)+' eerdere</div>' : '') + '</div>';
    return html;
  }

  function render(){
    var f = EX.get();
    var rows = WDK.applyFilter(DATA.all, 'wolf', f);
    markersLayer.clearLayers();
    markerIndex = {};
    var maxCount = 1;
    rows.forEach(function(b){ if (b.t > maxCount) maxCount = b.t; });
    var latestRow = null;
    rows.forEach(function(b){
      var m = L.circleMarker([b.lat, b.lon], {
        radius: radius(b.t, maxCount),
        color: 'var(--map-surface)',
        weight: 1.4,
        fillColor: COLORS[b.dom],
        fillOpacity: 0.85
      });
      m.bindPopup(popupHtml(b), { maxWidth:240 });
      m.addTo(markersLayer);
      markerIndex[b.id] = { marker:m, b:b };
      if (b.ev.length && (!latestRow || b.ev[0].d > latestRow.ev[0].d)) latestRow = b;
    });
    if (latestRow){
      L.circleMarker([latestRow.lat, latestRow.lon], {
        radius: radius(latestRow.t, maxCount),
        className: 'pulse-halo',
        color: COLORS[latestRow.dom],
        weight: 2,
        fill: false,
        interactive: false
      }).addTo(markersLayer);
    }
    var s = renderStats(rows);
    EX.setHeatPoints(rows.map(function(b){ return { lat:b.lat, lon:b.lon, w:b.t }; }));
    EX.setSummary(s.total, s.places);
    syncTabs(f);
  }

  function renderStats(rows){
    var s = WDK.stats(rows);
    var periodLabel = WDK.periodLabel(s);
    var statsEl = document.getElementById('stats');
    statsEl.innerHTML =
      '<div class="stat"><div class="n">'+s.total+'</div><div class="l">Meldingen</div></div>' +
      '<div class="stat k-zicht"><div class="n">'+s.byType.zichtmelding+'</div><div class="l">Zichtmeldingen</div></div>' +
      '<div class="stat k-aanval"><div class="n">'+s.byType.aanval+'</div><div class="l">Aanvallen op vee</div></div>' +
      '<div class="stat"><div class="n">'+s.places+'</div><div class="l">Plaatsen'+(periodLabel ? ' &middot; '+periodLabel : '')+'</div></div>';
    return s;
  }

  // ---- filterbalk: type, periode, tijdschuif (afspelen), hitte-laag; de stand staat ook in de URL ----
  var EX = WDK.mountExplorer({ el:document.getElementById('explorer'), map:map, rows:DATA.all, onChange:render });

  // de tabbladen zijn snelkeuzes voor de periode: "sinds het begin" of "laatste 2 weken"
  function recentFrom(){ return WDK.recentCutoff(RECENT_DAYS); }
  function syncTabs(f){
    var which = (!f.van && !f.tot) ? 'all' : (f.van === recentFrom() && !f.tot ? 'last2w' : null);
    document.querySelectorAll('.tab').forEach(function(t){
      var on = t.getAttribute('data-set') === which;
      t.classList.toggle('active', on);
      t.setAttribute('aria-selected', on ? 'true' : 'false');
    });
  }
  document.querySelectorAll('.tab').forEach(function(tab){
    tab.addEventListener('click', function(){
      EX.set({ van: tab.getAttribute('data-set') === 'last2w' ? recentFrom() : null, tot:null });
    });
  });

  document.getElementById('zoomIn').addEventListener('click', function(){ map.zoomIn(); });
  document.getElementById('zoomOut').addEventListener('click', function(){ map.zoomOut(); });
  document.getElementById('zoomReset').addEventListener('click', function(){ map.setView(INITIAL_CENTER, INITIAL_ZOOM); });

  // ---- plaats zoeken: vind een locatie, vlieg ernaartoe, open de popup ----
  var normalize = WDK.normalizeText;
  var searchInput = document.getElementById('placeSearch');
  var searchResultsEl = document.getElementById('searchResults');

  function mostRecentAanval(b){
    for (var i=0;i<b.ev.length;i++){ if (b.ev[i].ty === 'aanval') return b.ev[i]; }
    return null;
  }

  function renderSearchResults(matches, q){
    if (!matches.length){
      searchResultsEl.innerHTML = '<div class="search-empty">Geen plaats gevonden voor &ldquo;'+WDK.esc(q)+'&rdquo;.</div>';
      searchResultsEl.hidden = false;
      return;
    }
    searchResultsEl.innerHTML = matches.map(function(b){
      var ma = mostRecentAanval(b);
      var meta = ma
        ? '<span class="si-meta has-attack">Meest recente aanval: '+fmtDate(ma.d)+'</span>'
        : '<span class="si-meta">Laatste melding: '+fmtDate(b.ev[0].d)+' &middot; '+TYPE_LABEL[b.ev[0].ty]+'</span>';
      return '<div class="search-item" data-id="'+WDK.esc(b.id)+'">' +
        '<span class="si-name">'+nameHtml(b.n)+'</span>' + meta +
        '</div>';
    }).join('');
    searchResultsEl.hidden = false;
  }

  function doSearch(){
    var q = normalize(searchInput.value.trim());
    if (!q){ searchResultsEl.hidden = true; searchResultsEl.innerHTML=''; return; }
    var starts = [], contains = [];
    DATA.all.forEach(function(b){
      var n = normalize(b.n);
      if (n.indexOf(q) === 0) starts.push(b);
      else if (n.indexOf(q) !== -1) contains.push(b);
    });
    renderSearchResults(starts.concat(contains).slice(0,8), searchInput.value.trim());
  }

  function selectPlace(id){
    searchResultsEl.hidden = true;
    searchInput.value = stripExact(placeById[id].n).base;
    searchInput.blur(); // verberg het mobiele toetsenbord zodat de kaart zichtbaar is
    if (!markerIndex[id]) EX.set({ types:null, van:null, tot:null }); // door het filter verborgen? dan het filter wissen
    var entry = markerIndex[id];
    if (entry){
      map.flyTo(entry.marker.getLatLng(), Math.max(map.getZoom(), 13), { duration:0.6 });
      entry.marker.openPopup();
    }
    setTimeout(function(){
      var r = mapWrap.getBoundingClientRect();
      var visible = r.top >= 0 && r.bottom <= (window.innerHeight || document.documentElement.clientHeight);
      if (!visible) mapWrap.scrollIntoView({ behavior:'smooth', block:'center' });
    }, 80);
  }

  searchInput.addEventListener('input', doSearch);
  searchInput.addEventListener('focus', function(){ if (searchInput.value.trim()) doSearch(); });
  searchInput.addEventListener('keydown', function(ev){
    if (ev.key === 'Enter'){
      var first = searchResultsEl.querySelector('.search-item');
      if (first) selectPlace(first.getAttribute('data-id'));
      ev.preventDefault();
    } else if (ev.key === 'Escape'){
      searchResultsEl.hidden = true;
    }
  });
  searchResultsEl.addEventListener('click', function(ev){
    var item = ev.target.closest('.search-item');
    if (item) selectPlace(item.getAttribute('data-id'));
  });
  document.addEventListener('click', function(ev){
    if (!ev.target.closest('.map-search')) searchResultsEl.hidden = true;
  });

  window.addEventListener('resize', function(){ map.invalidateSize(); });

  if (LOADED.overig.length){
    document.getElementById('outlierNote').textContent = 'Meldingen buiten de Veluwe (niet op deze kaart, wel op de landelijke kaart op de homepage): ' +
      LOADED.overig.map(function(o){ return o.n + ' ('+o.t+'x)'; }).join(', ') + '.';
  }

  // ---- alles wat uit de meldingen volgt komt uit assets/site.js: verwachting, hotspots, weetjes ----
  WDK.renderForecast(document.getElementById('forecastCard'), { species:'wolf', rows:LOADED.veluwe, scope:'veluwe', updatedAt:LOADED.updatedAt });
  WDK.renderFunFacts(document.getElementById('funCard'), { rows:LOADED.veluwe });
  WDK.renderLivestock(document.getElementById('attackAnimalsCard'), { rows:LOADED.all, mode:'attacks', where:'in heel Nederland' });
  WDK.renderLivestock(document.getElementById('killedCard'), { rows:LOADED.all, mode:'killed', where:'in heel Nederland' });

  render();
})();
</script>

<script>
(function(){
  var btn = document.getElementById('backToTop');
  if (!btn) return;
  var visible = false;
  function onScroll(){
    var shouldShow = window.scrollY > 400;
    if (shouldShow !== visible){
      visible = shouldShow;
      btn.classList.toggle('is-visible', visible);
    }
  }
  window.addEventListener('scroll', onScroll, { passive:true });
  onScroll();
  btn.addEventListener('click', function(){
    window.scrollTo({ top:0, behavior:'smooth' });
  });
})();
</script>
</body>
</html>
