# Draait de tests van de SeaTable-koppeling (nep-SeaTable en nep-PDOK, geen internet of token nodig).
name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  sync-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 tools/test_seatable_sync.py
      - run: python3 tools/test_site_seo.py
